systemProp.gradle.user.home = .gradle
org.gradle.jvmargs = -Xmx4G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# NOTE: since 26.x Fabric no longer publishes Yarn/intermediary mappings;
# Minecraft is developed against official Mojang names directly.
minecraft_version = 26.2
loader_version = 0.19.3
loom_version = 1.17.20

mod_version = 1.0.1
maven_group = ru.bulldog
archives_base_name = justmap

# Dependencies
# currently not on the main fabric site, check on the maven: https://maven.fabricmc.net/net/fabricmc/fabric
fabric_version = 0.158.0+26.2
cloth_version = 26.2.155
modmenu_version = 20.0.1
